name: heartbeat-watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: heartbeat-watchdog
  cancel-in-progress: false

env:
  GIST_ID: a9e0f48ddb0b673ddf233cb725b79490
  STALE_SECONDS: "600"
  REPEAT_SECONDS: "1800"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run watchdog
        run: node watchdog.mjs
        env:
          GIST_ID: ${{ env.GIST_ID }}
          GIST_OWNER: ${{ github.repository_owner }}
          STALE_SECONDS: ${{ env.STALE_SECONDS }}
          REPEAT_SECONDS: ${{ env.REPEAT_SECONDS }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
          TG_CHAT2: ${{ secrets.TG_CHAT_ID2 }}
